<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Envelope for You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #120c08;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(60, 30, 15, 0.4), rgba(10, 5, 2, 0.9)),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px);
            font-family: 'Marcellus', serif;
            color: #2c1a0e;
            overflow-x: hidden;
            padding: 20px;
        }

        #petal-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Vintage Envelope */
        .envelope-wrapper {
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.8s ease;
        }

        .envelope-wrapper:hover {
            transform: translateY(-5px) scale(1.02);
        }

        .envelope {
            width: 320px;
            height: 220px;
            background: #c39b6b;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 4px);
            border-radius: 6px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.2);
            border: 1px solid #8c6739;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 160px solid #b38a5b;
            border-right: 160px solid #b38a5b;
            border-bottom: 110px solid #a2794a;
            border-top: 110px solid transparent;
            border-radius: 0 0 6px 6px;
        }

        /* Wax Seal */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #a82323, #580c0c);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #7a1616;
            z-index: 3;
            transition: transform 0.3s ease;
        }

        .wax-seal::after {
            content: '♥';
            color: #3b0505;
            font-size: 24px;
            text-shadow: 0 1px 1px rgba(255,255,255,0.2);
        }

        .click-hint {
            margin-top: 25px;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            font-size: 0.85rem;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
            text-align: center;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Flower Popup Overlay */
        .flower-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .flower-overlay.active {
            opacity: 1;
        }

        .rose-container {
            transform: scale(0.2);
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        .flower-overlay.active .rose-container {
            transform: scale(1.2);
        }

        .rose {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .petal {
            position: absolute;
            background: linear-gradient(to top, #6b0919, #d62828);
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            transform-origin: bottom center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .petal-1 { width: 40px; height: 60px; left: 30px; top: 10px; transform: rotate(0deg); }
        .petal-2 { width: 40px; height: 60px; left: 30px; top: 10px; transform: rotate(72deg); }
        .petal-3 { width: 40px; height: 60px; left: 30px; top: 10px; transform: rotate(144deg); }
        .petal-4 { width: 40px; height: 60px; left: 30px; top: 10px; transform: rotate(216deg); }
        .petal-5 { width: 40px; height: 60px; left: 30px; top: 10px; transform: rotate(288deg); }
        
        .petal-center {
            position: absolute;
            width: 26px;
            height: 36px;
            background: linear-gradient(to top, #40000a, #9e1b1b);
            border-radius: 50%;
            top: 25px;
            left: 37px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        /* Parchment Love Letter */
        .letter-card {
            display: none;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            background: #f4e4bc;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4), rgba(210, 180, 140, 0.4)),
                repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(160, 120, 80, 0.15) 30px);
            padding: 50px 45px;
            border-radius: 4px;
            box-shadow: 
                0 0 50px rgba(0,0,0,0.9), 
                inset 0 0 60px rgba(120, 80, 40, 0.35),
                0 0 0 12px #2c1a0e;
            border: 2px solid #8c6739;
            width: 100%;
            position: relative;
            transition: opacity 1s ease, transform 1s ease;
            z-index: 5;
        }

        .letter-card.visible {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .corner-decoration {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid #7a5229;
        }
        .top-left { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .top-right { top: 12px; right: 12px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 12px; left: 12px; border-right: none; border-top: none; }
        .bottom-right { bottom: 12px; right: 12px; border-left: none; border-top: none; }

        .letter-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: #4a2c11;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(122, 82, 41, 0.3);
            padding-bottom: 10px;
        }

        .letter-body {
            font-family: 'Great Vibes', cursive;
            font-size: 2.1rem;
            line-height: 1.8;
            color: #2b1704;
            position: relative;
        }

        .line-container {
            margin-bottom: 15px;
            min-height: 2.5rem;
            word-wrap: break-word;
        }

        /* Letter Spans */
        .char {
            opacity: 0;
            display: inline;
            transition: opacity 0.05s ease-in;
        }

        .char.written {
            opacity: 1;
        }

        .signature-container {
            text-align: right;
            margin-top: 20px;
        }

        /* Animated Quill Pen */
        .quill-pen {
            position: absolute;
            width: 45px;
            height: 45px;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            transform: translate(-10%, -85%) rotate(-20deg);
            filter: drop-shadow(3px 5px 4px rgba(0,0,0,0.4));
            transition: opacity 0.3s ease, left 0.06s linear, top 0.06s linear;
        }

        .quill-pen.writing {
            animation: writingJitter 0.12s infinite alternate ease-in-out;
        }

        @keyframes writingJitter {
            0% { transform: translate(-10%, -85%) rotate(-22deg); }
            100% { transform: translate(-10%, -88%) rotate(-17deg); }
        }

        @media (max-width: 480px) {
            .letter-card { padding: 35px 25px; }
            .letter-body { font-size: 1.7rem; line-height: 1.6; }
            .envelope { width: 270px; height: 185px; }
            .envelope::before {
                border-left-width: 135px;
                border-right-width: 135px;
                border-bottom-width: 90px;
                border-top-width: 95px;
            }
        }
    </style>
</head>
<body>

    <canvas id="petal-canvas"></canvas>

    <div class="container">
        <!-- Interactive Envelope -->
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="openLetter()">
            <div class="envelope">
                <div class="wax-seal"></div>
            </div> 
            <div class="click-hint">Happy First Month, Bebu!</div>
        </div>

        <!-- Flower Bloom Transition -->
        <div class="flower-overlay" id="flowerOverlay">
            <div class="rose-container">
                <div class="rose">
                    <div class="petal petal-1"></div>
                    <div class="petal petal-2"></div>
                    <div class="petal petal-3"></div>
                    <div class="petal petal-4"></div>
                    <div class="petal petal-5"></div>
                    <div class="petal-center"></div>
                </div>
            </div>
        </div>

        <!-- Main Parchment Letter -->
        <div class="letter-card" id="letterCard">
            <div class="corner-decoration top-left"></div>
            <div class="corner-decoration top-right"></div>
            <div class="corner-decoration bottom-left"></div>
            <div class="corner-decoration bottom-right"></div>

            <!-- SVG Feather Quill Pen -->
            <svg class="quill-pen" id="quillPen" viewBox="0 0 100 100">
                <path d="M90,10 C60,20 30,50 10,90 C35,65 65,45 90,10 Z" fill="#8c1c1c" />
                <path d="M90,10 C70,30 45,55 20,80 C40,60 70,35 90,10 Z" fill="#b82828" />
                <path d="M25,75 L5,98 L12,92 L28,78 Z" fill="#d4af37" />
                <path d="M5,98 L2,100 L7,96 Z" fill="#120c08" />
            </svg>

            <h1 class="letter-title">Hii bebuuu)))</h1>

            <div class="letter-body">
                <div class="line-container" id="line1" data-text="My heart speaks in quiet whispers whenever I think of you."></div>
                <div class="line-container" id="line2" data-text="Hii bebu, happy one month to us po. Sobrang bilis ng panahon, parang kahapon lang nung first move ako sayo. Thank you so much po for understanding me, for being patient with me, and for never getting tired of me. I truly appreciate every little thing you do for me."></div>
                <div class="line-container" id="line3" data-text="I know hindi naman perfect ang timing natin ngayon, but I want to take this opportunity to ask you properly. Can I court you, bebu? I want to pursue you sincerely, patiently, and properly. I want to prove through my actions, not just my words, how much I love and value you. I want to know you more, understand you better, and be someone you can always count on. I may not be perfect, but I promise to always try, to respect you, and to choose you every day."></div>
                <div class="line-container signature-container" id="line4" data-text="I love you so much, pretty. Happy one month to us. Yours always, ♥"></div>
            </div>
        </div>
    </div>

    <script>
        function openLetter() {
            const envelopeWrapper = document.getElementById('envelopeWrapper');
            const flowerOverlay = document.getElementById('flowerOverlay');
            const letterCard = document.getElementById('letterCard');

            envelopeWrapper.style.opacity = '0';
            envelopeWrapper.style.pointerEvents = 'none';

            setTimeout(() => {
                envelopeWrapper.style.display = 'none';
                flowerOverlay.classList.add('active');

                setTimeout(() => {
                    flowerOverlay.classList.remove('active');
                    
                    setTimeout(() => {
                        letterCard.classList.add('visible');
                        prepareAndWriteText();
                        startPetalRain();
                    }, 400);

                }, 1500);

            }, 500);
        }

        /* Character-by-Character Writing Logic */
        async function prepareAndWriteText() {
            const pen = document.getElementById('quillPen');
            const letterCard = document.getElementById('letterCard');
            const lines = [
                document.getElementById('line1'),
                document.getElementById('line2'),
                document.getElementById('line3'),
                document.getElementById('line4')
            ];

            // Convert plain text into individual span tags per character
            lines.forEach(line => {
                const text = line.getAttribute('data-text');
                line.innerHTML = '';
                for (let char of text) {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char;
                    line.appendChild(span);
                }
            });

            pen.style.opacity = '1';
            pen.classList.add('writing');

            // Write line by line, character by character
            for (let line of lines) {
                const characters = line.querySelectorAll('.char');
                for (let charSpan of characters) {
                    charSpan.classList.add('written');

                    // Position the pen tip directly on the character being written
                    const cardRect = letterCard.getBoundingClientRect();
                    const charRect = charSpan.getBoundingClientRect();

                    if (charRect.width > 0) {
                        const penX = charRect.left - cardRect.left + (charRect.width / 2);
                        const penY = charRect.top - cardRect.top + charRect.height;

                        pen.style.left = `${penX}px`;
                        pen.style.top = `${penY}px`;
                    }

                    // Speed: adjust delay (ms) between characters
                    await new Promise(r => setTimeout(r, 55));
                }
                // Pause slightly at the end of each line
                await new Promise(r => setTimeout(r, 350));
            }

            pen.classList.remove('writing');
            pen.style.opacity = '0';
        }

        /* Falling Petals Background Canvas */
        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let petals = [];
        let petalAnimationActive = false;

        class Petal {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.7 + 0.3;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#b81d24';
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size, -this.size, this.size, 0, this.size * 1.5);
                ctx.bezierCurveTo(this.size, this.size, this.size, -this.size, 0, 0);
                ctx.fill();

                ctx.restore();
            }
        }

        function startPetalRain() {
            petalAnimationActive = true;
            animatePetals();
        }

        function animatePetals() {
            if (!petalAnimationActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (petals.length < 35 && Math.random() < 0.1) {
                petals.push(new Petal());
            }

            petals.forEach((petal, index) => {
                petal.update();
                petal.draw();
                if (petal.y > canvas.height + 20) {
                    petals.splice(index, 1);
                }
            });

            requestAnimationFrame(animatePetals);
        }
    </script>
</body>
</html>
